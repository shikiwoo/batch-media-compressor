name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]          # pushing a tag like v1.2.0 also publishes :1.2.0 and :1.2
  pull_request:           # PRs only build (to catch a broken Dockerfile), never push
  workflow_dispatch:      # "Run workflow" button in the Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # -> ghcr.io/shikiwoo/batch-media-compressor

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # lets the built-in GITHUB_TOKEN push to GHCR, no secrets needed

    steps:
      - uses: actions/checkout@v5

      # QEMU + buildx let one runner build both amd64 (PCs/servers) and arm64 (Raspberry Pi, ARM NAS, Apple Silicon)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # works out the tags: latest + sha-abc1234 on main, 1.2.0 / 1.2 on version tags
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # reuse layers from earlier runs, so the slow apt-get ffmpeg step is usually cached
          cache-from: type=gha
          cache-to: type=gha,mode=max
